name: FlightDeck
options:
  bundleIdPrefix: com.gregority9
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  FlightDeck:
    type: application
    platform: iOS
    sources: [FlightDeck]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gregority9.flightdeck
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: FlightDeck
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        MARKETING_VERSION: "1.1.0"
        CURRENT_PROJECT_VERSION: "2"
    scheme:
      testTargets: []
